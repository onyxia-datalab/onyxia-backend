authenticationMode: openidconnect

server:
  port: 8080
  # Bounds the graceful shutdown (in-flight requests, then background work).
  # Keep it below the pod's terminationGracePeriodSeconds (30s by default).
  shutdownTimeout: 25s

oidc:
  issuerURI: "https://auth.lab.sspcloud.fr/auth/realms/sspcloud"
  skipTLSVerify: false
  publicKey: ""
  audience: "onyxia"
  usernameClaim: "preferred_username"
  groupsClaim: "groups"
  rolesClaim: "roles"

security:
  corsAllowedOrigins: []

onboarding:
  namespacePrefix: user-
  groupNamespacePrefix: projet-
  namespaceLabels: { "created-by": "onyxia" }
  annotations:
    enabled: false
    static:
      created-by: Onyxia
    dynamic:
      last-login-timestamp: false
      userAttributes: []
  quotas:
    enabled: false
    default: {}
      # requests.memory: "10Gi"
      # requests.cpu: "10"
      # limits.memory: "10Gi"
      # limits.cpu: "10"
      # requests.storage: "100Gi"
      # count/pods: "50"
      # requests.ephemeral-storage: "10Gi"
      # limits.ephemeral-storage: "20Gi"
      # requests.nvidia.com/gpu: "0"
      # limits.nvidia.com/gpu: "0"
    userEnabled: false
    user: {}
      # requests.memory: "10Gi"
      # requests.cpu: "10"
      # limits.memory: "10Gi"
      # limits.cpu: "10"
      # requests.storage: "100Gi"
      # count/pods: "50"
      # requests.ephemeral-storage: "10Gi"
      # limits.ephemeral-storage: "20Gi"
      # requests.nvidia.com/gpu: "0"
      # limits.nvidia.com/gpu: "0"
    roles: {}
    groupEnabled: false
    group: {}
