authenticationMode: openidconnect

server:
  port: 8080
  # Bounds the graceful shutdown (in-flight requests, then background work).
  # Keep it below the pod's terminationGracePeriodSeconds (30s by default).
  shutdownTimeout: 25s

oidc:
  issuerURI: "https://auth.lab.sspcloud.fr/auth/realms/sspcloud"
  skipTLSVerify: false
  publicKey: ""
  audience: "onyxia"
  usernameClaim: "preferred_username"
  groupsClaim: "groups"
  rolesClaim: "roles"

security:
  corsAllowedOrigins: []

onboarding:
  namespacePrefix: user-
  groupNamespacePrefix: projet-
  namespaceLabels: { "created-by": "onyxia" }
  annotations:
    enabled: false
    static:
      created-by: Onyxia
    dynamic:
      last-login-timestamp: false
      userAttributes: []
  quotas:
    enabled: false
    default: {}
      # requests.memory: "10Gi"
      # requests.cpu: "10"
      # limits.memory: "10Gi"
      # limits.cpu: "10"
      # requests.storage: "100Gi"
      # count/pods: "50"
      # requests.ephemeral-storage: "10Gi"
      # limits.ephemeral-storage: "20Gi"
      # requests.nvidia.com/gpu: "0"
      # limits.nvidia.com/gpu: "0"
    userEnabled: false
    user: {}
      # requests.memory: "10Gi"
      # requests.cpu: "10"
      # limits.memory: "10Gi"
      # limits.cpu: "10"
      # requests.storage: "100Gi"
      # count/pods: "50"
      # requests.ephemeral-storage: "10Gi"
      # limits.ephemeral-storage: "20Gi"
      # requests.nvidia.com/gpu: "0"
      # limits.nvidia.com/gpu: "0"
    roles: {}
    groupEnabled: false
    group: {}
      # requests.memory: "10Gi"
      # requests.cpu: "10"
      # limits.memory: "10Gi"
      # limits.cpu: "10"
      # requests.storage: "100Gi"
      # count/pods: "50"
      # requests.ephemeral-storage: "10Gi"
      # limits.ephemeral-storage: "20Gi"
      # requests.nvidia.com/gpu: "0"
      # limits.nvidia.com/gpu: "0"
  # Kubernetes objects applied in every onboarded namespace, in this order,
  # at each onboarding (forced server-side apply: fields set here are brought
  # back to these values, other fields are left alone). One YAML manifest
  # per entry. Only namespaced kinds are accepted, metadata.namespace must
  # not be set. String values may contain these placeholders (any other
  # ${...} is left as is):
  #   ${onyxia.namespace}  the onboarded namespace
  #   ${onyxia.username}   the user who triggered the onboarding (for a group
  #                        namespace, whichever member onboarded it)
  #   ${onyxia.group}      the single group named in the onboarding request
  #                        (not the array of the user's OIDC groups), without
  #                        groupNamespacePrefix; empty for a user namespace
  # The onboarding API needs the permissions to manage these kinds
  # (and, for a Role, every permission it grants).
  namespaceResources: []
    # Example: a namespace-scoped identity to install services with.
    # - |
    #   apiVersion: v1
    #   kind: ServiceAccount
    #   metadata:
    #     name: onyxia-installer-sa
    #   automountServiceAccountToken: false
    # - |
    #   apiVersion: rbac.authorization.k8s.io/v1
    #   kind: Role
    #   metadata:
    #     name: onyxia-installer-role
    #   rules:
    #     - apiGroups: [""]
    #       resources: ["pods", "services", "configmaps", "secrets", "persistentvolumeclaims"]
    #       verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    #     - apiGroups: ["apps"]
    #       resources: ["deployments", "statefulsets"]
    #       verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    # - |
    #   apiVersion: rbac.authorization.k8s.io/v1
    #   kind: RoleBinding
    #   metadata:
    #     name: onyxia-installer-rb
    #   roleRef:
    #     apiGroup: rbac.authorization.k8s.io
    #     kind: Role
