sonar.projectKey=onyxia-datalab_onyxia-backend
sonar.organization=onyxia-datalab
sonar.host.url=https://sonarcloud.io

sonar.sources=cmd,internal,onboarding,services

sonar.qualitygate.wait=true

# Coverage
sonar.go.coverage.reportPaths=./cover.out

sonar.exclusions=**/*_test.go,**/*_gen.go,**/*_mock.go,**/mocks/**
sonar.cpd.exclusions=**/*_gen.go,**/*_mock.go,**/mocks/**,cmd/*/main.go,**/api/middleware/security.go
# Startup and dependency wiring: exercised by running the binaries, not by unit tests
sonar.coverage.exclusions=cmd/**,**/api/route/**,**/bootstrap/app.go,internal/kube/client.go,internal/logging/default.go,internal/usercontext/test_helpers.go
