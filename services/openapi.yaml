openapi: 3.1.0
info:
  title: Onyxia services API for a region
  description: >
    Onyxia services API is responsible to provide service catalog and to run,
    modify and delete services.
  version: 0.0.0

security:
  - oidc: []

tags:
  - name: services
    description: Service lifecycle (install)
  - name: events
    description: >
      Event streams (SSE), opened while a service is changing and closed by the
      server once it is stable. There is no polling to do: load the state once
      (listServices, getProjectQuota), then follow the services being changed.
  - name: quotas
    description: Resource quotas of the project
  - name: catalogs
    description: Service catalogs

paths:
  /api/services/catalogs/{catalogId}/packages/{packageName}:
    get:
      security:
        - oidc: []
      tags: [catalogs]
      operationId: getMyPackage
      summary: Get detailed information about a package in a catalog
      description: >
        Returns detailed information about a package in a catalog, including
        available versions.
      parameters:
        - name: catalogId
          in: path
          required: true
          schema: { type: string }
          description: Catalog identifier
        - name: packageName
          in: path
          required: true
          schema: { type: string }
          description: Package name
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetailedPackage" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/services/catalogs/{catalogId}/packages/{packageName}/versions/{version}/schema:
    get:
      security:
        - oidc: []
      tags: [catalogs]
      operationId: getPackageSchema
      summary: Get the values.schema.json of a versioned package
      description: >
        Returns the values.schema.json of a versioned package. The schema is
        enhanced by user permissions and roles.
      parameters:
        - name: catalogId
          in: path
          required: true
          schema: { type: string }
          description: Catalog identifier
        - name: packageName
          in: path
          required: true
          schema: { type: string }
          description: Package name
        - name: version
          in: path
          required: true
          schema:
            type: string
            format: semver
          description: Package version (semver)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/services/catalogs:
    get:
      security:
        - {}
        - oidc: []
      tags: [catalogs]
      operationId: getMyCatalogs
      summary: List available catalogs and packages for installing for the user
      description: >
        Returns the list of catalogs and packages available for the user.
        The list of packages is filtered by user permissions if the user is
        authenticated. Otherwise returns the public catalog.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Catalog" }
        "500":
          $ref: "#/components/responses/InternalError"

  /api/services:
    get:
      tags: [services]
      operationId: listServices
      summary: List all services in a project namespace
      parameters:
        - $ref: "#/components/parameters/onyxiaProject"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Service" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/services/{releaseId}:
    get:
      tags: [services]
      operationId: getService
      summary: Get the current state of a service
      parameters:
        - $ref: "#/components/parameters/releaseId"
        - $ref: "#/components/parameters/onyxiaProject"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Service" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [services]
      operationId: deleteService
      summary: Uninstall a service
      description: >
        Runs helm uninstall for the release and removes the associated Onyxia
        secret. This operation is irreversible.
      parameters:
        - $ref: "#/components/parameters/releaseId"
        - $ref: "#/components/parameters/onyxiaProject"
      responses:
        "204":
          description: No Content – service deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [services]
      operationId: installService
      summary: Trigger service installation (async)
      description: >
        Starts an install for the given releaseId and returns 202 as soon as
        the package is resolved; the install goes on in the background. Follow
        it with the service's event stream (watchServiceEvents). The releaseId
        is reserved by the first install: a second install with the same
        releaseId gets 409, whether the first one is still running or done.
      parameters:
        - $ref: "#/components/parameters/releaseId"
        - $ref: "#/components/parameters/onyxiaProject"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceInstallRequest" }
            examples:
              jupyter:
                value:
                  catalogId: ide
                  packageName: jupyter-python
                  packageVersion: 2.3.4
                  friendlyName: My Jupyter
                  share: false
                  options:
                    ingress:
                      enabled: true
                      hostname: user-xxxx.user.lab.sspcloud.fr
      responses:
        "202":
          description: Accepted – installation running
          headers:
            Location:
              description: The service's location (getService), e.g. /api/services/jupyter-python-626146.
              schema: { type: string, format: uri-reference }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/services/{releaseId}/suspended:
    put:
      tags: [services]
      operationId: setServiceSuspended
      summary: Suspend or resume a service
      description: >
        Returns once the release is updated; its pods then stop or start in
        the background (Suspending, Deploying). Follow it with the service's
        event stream (watchServiceEvents).
      parameters:
        - $ref: "#/components/parameters/releaseId"
        - $ref: "#/components/parameters/onyxiaProject"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [suspended]
              properties:
                suspended:
                  type: boolean
                  description: true to suspend, false to resume
      responses:
        "204":
          description: No Content
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/services/{releaseId}/shared:
    put:
      tags: [services]
      operationId: setServiceShared
      summary: Share or unshare a service with the project members
      description: >
        Only the owner of the service may change this flag. Sharing requires
        the service's catalog to allow it.
      parameters:
        - $ref: "#/components/parameters/releaseId"
        - $ref: "#/components/parameters/onyxiaProject"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shared]
              properties:
                shared:
                  type: boolean
                  description: true to share with the project members, false to make private
      responses:
        "204":
          description: No Content
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/services/{releaseId}/events:
    get:
      tags: [events]
      operationId: watchServiceEvents
      summary: Follow a service while it changes (SSE)
      description: >
        Server-Sent Events (text/event-stream), one frame per event:
        "event: <name>\ndata: <JSON>\n\n" (see ServiceStreamEvent for the
        payload of each event). Open it after an install, suspend, resume or
        delete, or when showing a service in a transitional status.


        - The first event is a "status" with the current state, and a "quota"
        with the project's quota when there is one. A reconnection simply
        starts again from the current state: there is no event id to resume
        from.

        - Then "status" is sent each time the service changes, "progress" for
        each step Kubernetes reports (scheduling, image pull, start, probe
        failure...), and "quota" each time the project's quota usage changes.

        - The server ends the stream with "done" once the service is stable
        (Running, Suspended, Ghost, an Error with reason release_failed),
        deleted, or after a maximum duration. Any other Error keeps the stream
        open: a crash loop or an exceeded quota can resolve by itself.

        - A comment line (": keep-alive") is sent periodically so that proxies
        keep the connection open.


        The browser's native EventSource can't send the Authorization and
        X-Onyxia-Project headers: use a fetch-based SSE client.
      parameters:
        - $ref: "#/components/parameters/releaseId"
        - $ref: "#/components/parameters/onyxiaProject"
      responses:
        "200":
          description: SSE stream
          headers:
            Cache-Control: { schema: { type: string }, description: no-cache }
            X-Accel-Buffering:
              schema: { type: string }
              description: "no: asks reverse proxies not to buffer the stream."
          content:
            text/event-stream:
              schema:
                type: string
                x-oas-doc-schema:
                  $ref: "#/components/schemas/ServiceStreamEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/services/project/quota:
    get:
      tags: [quotas]
      operationId: getProjectQuota
      summary: Get the resource quota of the project and its usage
      description: >
        Initial load only: while a service changes, its event stream pushes
        the quota updates.
      parameters:
        - $ref: "#/components/parameters/onyxiaProject"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectQuota" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  parameters:
    onyxiaProject:
      in: header
      name: X-Onyxia-Project
      required: true
      schema: { type: string }
      description: Project identifier in Onyxia (user or group namespace)
    releaseId:
      in: path
      name: releaseId
      required: true
      schema:
        type: string
        minLength: 1
        pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
      description: Logical release identifier

  responses:
    UnprocessableEntity:
      description: Unprocessable entity — operation not supported by this service
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    BadRequest:
      description: Bad request
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Unauthorized
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: Forbidden
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: Conflict — resource already exists or operation already running
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    InternalError:
      description: Internal server error
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Catalog:
      type: object
      required: [id, name, packages]
      properties:
        id: { type: string, description: Catalog id }
        name:
          $ref: "#/components/schemas/LocalizedString"
          description: The name of the catalog
        description:
          $ref: "#/components/schemas/LocalizedString"
          description: The description of the catalog
        status:
          type: string
          enum: [PROD, TEST]
          description: Is the catalog a test or a production catalog
        highlightedPackages:
          type: array
          description: Names of important packages of the catalog to highlight in the UI
          items: { type: string }
        packages:
          type: array
          description: List of packages available in the catalog
          items: { $ref: "#/components/schemas/Package" }

    Package:
      type: object
      required: [name, icon]
      properties:
        name: { type: string, description: Package name }
        description:
          { type: string, description: The description of the package }
        icon: { type: string, format: uri, description: URL to an icon }
        home: { type: string, format: uri, description: URL to the home page }

    DetailedPackage:
      allOf:
        - $ref: "#/components/schemas/Package"
        - type: object
          required: [versions]
          properties:
            versions:
              type: array
              description: List of versions available for the package
              items:
                type: string
                format: semver

    ServiceInstallRequest:
      type: object
      required: [catalogId, packageName, options]
      properties:
        catalogId:
          type: string
          description: Catalog where the package is taken from.
        packageName:
          type: string
          description: Package name used to create the service.
        packageVersion:
          type: string
          format: semver
          description: Version of the Helm package. The latest version when absent.
        options:
          type: object
          additionalProperties: true
          description: Options of the package (values.yaml for Helm).
        share:
          type: boolean
          default: false
          description: When true, the service is visible to all users of the namespace.
        friendlyName:
          type: string
          description: Display name of the service. The package name when absent.

    LocalizedString:
      description: A string or a map of localized strings by language code
      oneOf:
        - type: string
          example: "Hello"
        - type: object
          additionalProperties:
            type: string
          example:
            en: "Hello"
            fr: "Bonjour"

    Service:
      type: object
      required: [releaseId, status, friendlyName, owner, catalogId, share]
      properties:
        releaseId: { type: string, description: Release identifier }
        status:
          type: string
          enum:
            [
              Deploying,
              Running,
              Error,
              Ghost,
              Suspending,
              Suspended,
              Terminating,
            ]
          description: >
            Current lifecycle state of the service, derived the same way by
            getService and listServices.
            Deploying: being installed, or its pods are not all ready yet.
            Running: all its pods are ready.
            Error: the release failed or a pod is failing; not terminal, a
            service may recover (e.g. after a crash loop).
            Ghost: the service record exists but its release is gone.
            Suspending: suspended, but some pods are still shutting down.
            Suspended: suspended, no pod left.
            Terminating: the release is being uninstalled.
        friendlyName: { type: string, description: Display name }
        owner: { type: string, description: Username of the service owner }
        catalogId: { type: string, description: Source catalog identifier }
        share:
          {
            type: boolean,
            description: Whether the service is visible to all namespace users,
          }
        error:
          $ref: "#/components/schemas/ServiceError"

    ServiceError:
      type: object
      description: >
        Why a service is in Error. Returned by getService, always present when
        the status is Error; listServices returns the status alone.
      required: [reason]
      properties:
        reason:
          type: string
          description: >
            release_failed: the last install or upgrade of the release failed
            (message holds the deployment tool's description, no podName).
            quota_exceeded: a pod can't be created because the project's quota
            is exceeded (no podName); it resolves once resources are freed.
            The other reasons come from a failing pod, named by podName.
          enum:
            [
              release_failed,
              quota_exceeded,
              crash_loop,
              oom_killed,
              image_pull,
              config_error,
              unschedulable,
              readiness_failed,
            ]
        podName:
          { type: string, description: The failing pod, for pod reasons. }
        message: { type: string }
        restartCount: { type: integer, minimum: 0 }
        exitCode: { type: integer }
        image: { type: string }
        limit: { type: string }

    ServiceStreamEvent:
      description: >
        An event of the service's stream: "event" is the SSE event name and
        "data" the JSON payload.
      oneOf:
        - type: object
          required: [event, data]
          properties:
            event: { type: string, const: status }
            data: { $ref: "#/components/schemas/Service" }
        - type: object
          required: [event, data]
          properties:
            event: { type: string, const: progress }
            data: { $ref: "#/components/schemas/ServiceProgress" }
        - type: object
          required: [event, data]
          properties:
            event: { type: string, const: quota }
            data: { $ref: "#/components/schemas/ProjectQuota" }
        - type: object
          required: [event, data]
          properties:
            event: { type: string, const: done }
            data: { $ref: "#/components/schemas/StreamEnd" }

    ServiceProgress:
      type: object
      description: >
        A step of the service reported by Kubernetes, to show what is going on
        while the status stays Deploying (pulling a large image can take
        minutes).
      required: [step, level, at]
      properties:
        step:
          type: string
          description: >
            scheduled: a pod was placed on a node.
            scheduling_failed: no node can host a pod yet (resources,
            constraints); Kubernetes keeps retrying.
            pulling_image / image_pulled: a container image is being
            downloaded / is ready.
            started: a container started.
            probe_failed: a readiness or liveness probe failed.
            creation_failed: a pod could not be created, e.g. the project's
            quota is exceeded.
            other: any other step, described by message.
          enum:
            [
              scheduled,
              scheduling_failed,
              pulling_image,
              image_pulled,
              started,
              probe_failed,
              creation_failed,
              other,
            ]
        level:
          type: string
          enum: [info, warning]
        podName: { type: string, description: The pod concerned, if any. }
        image: { type: string, description: For the image steps. }
        message:
          { type: string, description: Kubernetes' description of the step. }
        at: { type: string, format: date-time }

    StreamEnd:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          description: >
            stable: the service reached a stable status (the last "status"
            event).
            deleted: the service no longer exists.
            timeout: the stream reached its maximum duration while the service
            was still changing; reopen it to keep following.
          enum: [stable, deleted, timeout]

    ProjectQuota:
      type: object
      description: >
        The resource quota of the project. When several Kubernetes resource
        quotas limit the same resource, the most restrictive one is reported.
        Empty when the project has no quota.
      required: [resources]
      properties:
        resources:
          type: array
          items: { $ref: "#/components/schemas/QuotaResource" }

    QuotaResource:
      type: object
      required: [name, hard, used]
      properties:
        name:
          type: string
          description: The limited resource, as configured by the administrator.
          example: requests.memory
        hard:
          type: string
          description: The limit, as a Kubernetes quantity.
          example: 10Gi
        used:
          type: string
          description: The current usage, as a Kubernetes quantity.
          example: 2560Mi

    Problem:
      type: object
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
      additionalProperties: true

  securitySchemes:
    oidc:
      type: http
      scheme: bearer
      x-ogen-custom-security: true
      description: >
        OAuth2 access token (Bearer or DPoP-bound). When the token contains a cnf.jkt claim,
        clients must also send a per-request "DPoP" proof header (RFC 9449).
